<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poppy - 3D VTuber</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: #0b0f1c;
            height: 100vh;
            overflow: hidden;
        }
        #scene {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        .overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .top-bar {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title {
            font-family: 'Orbitron', sans-serif;
            color: #00e5e5;
            letter-spacing: 6px;
            font-size: 20px;
            text-shadow: 0 0 20px rgba(0,229,229,0.6);
        }
        .subtitle {
            font-size: 10px;
            color: rgba(0,229,229,0.6);
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .controls {
            pointer-events: auto;
            padding: 0 24px 24px;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .btn {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 12px;
            padding: 10px 18px;
            border: 1px solid #00e5e5;
            color: #00e5e5;
            background: rgba(0, 20, 30, 0.6);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover, .btn.active {
            background: #00e5e5;
            color: #0b0f1c;
            box-shadow: 0 0 18px rgba(0,229,229,0.6);
        }
        .help {
            position: fixed;
            right: 16px;
            bottom: 20px;
            color: rgba(255,255,255,0.6);
            font-size: 11px;
            text-align: right;
            line-height: 1.5;
        }
        .floating {
            position: fixed;
            pointer-events: none;
            z-index: 6;
        }
        .spark {
            position: absolute;
            color: #00e5e5;
            font-size: 16px;
            animation: floatUp 1.4s ease-out forwards;
            text-shadow: 0 0 12px rgba(0,229,229,0.7);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
        }
    </style>
</head>
<body>
    <canvas id="scene"></canvas>
    <div class="overlay">
        <div class="top-bar">
            <div>
                <div class="title">POPPY 3D</div>
                <div class="subtitle">Realistic Render - Bikini Look</div>
            </div>
        </div>
        <div class="controls">
            <button class="btn" id="danceBtn">Dance</button>
            <button class="btn" id="idleBtn">Idle</button>
            <button class="btn" id="spinBtn">Spin</button>
        </div>
        <div class="help">
            Drag to orbit<br>
            Scroll to zoom<br>
            Click for sparkle
        </div>
    </div>
    <div class="floating" id="floating"></div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.161.0/build/three.module.js';
        import { OrbitControls } from 'https://unpkg.com/three@0.161.0/examples/jsm/controls/OrbitControls.js';
        import { RoomEnvironment } from 'https://unpkg.com/three@0.161.0/examples/jsm/environments/RoomEnvironment.js';

        const canvas = document.getElementById('scene');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0f1c);

        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.6, 5);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 2.6;
        controls.maxDistance = 7;
        controls.target.set(0, 1.3, 0);
        controls.update();

        const pmrem = new THREE.PMREMGenerator(renderer);
        const env = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
        scene.environment = env;

        const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
        keyLight.position.set(2.5, 4, 3);
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0x88ccff, 0.8);
        fillLight.position.set(-2, 3, 2);
        scene.add(fillLight);

        const rimLight = new THREE.PointLight(0x00e5e5, 1.2, 10);
        rimLight.position.set(0, 2, -3);
        scene.add(rimLight);

        const floorMat = new THREE.MeshStandardMaterial({
            color: 0x101622,
            roughness: 0.8,
            metalness: 0.1
        });
        const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 64), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        scene.add(floor);

        const skinMat = new THREE.MeshPhysicalMaterial({
            color: 0xffd8c2,
            roughness: 0.45,
            metalness: 0,
            clearcoat: 0.15,
            clearcoatRoughness: 0.4,
            sheen: 0.2,
            sheenColor: new THREE.Color(0xffd0c0)
        });

        const hairMat = new THREE.MeshStandardMaterial({
            color: 0x0f0f14,
            roughness: 0.5,
            metalness: 0.2
        });

        const bikiniMat = new THREE.MeshPhysicalMaterial({
            color: 0x00e5e5,
            roughness: 0.25,
            metalness: 0.1,
            clearcoat: 0.4,
            clearcoatRoughness: 0.2
        });

        const body = new THREE.Group();
        scene.add(body);

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 64, 64), skinMat);
        head.position.y = 1.7;
        body.add(head);

        const hair = new THREE.Mesh(new THREE.SphereGeometry(0.3, 64, 64, 0, Math.PI * 2, 0, Math.PI * 0.55), hairMat);
        hair.position.y = 1.76;
        hair.rotation.x = Math.PI;
        body.add(hair);

        const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.18, 32), skinMat);
        neck.position.y = 1.44;
        body.add(neck);

        const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.34, 0.55, 6, 24), skinMat);
        torso.position.y = 1.05;
        body.add(torso);

        const hips = new THREE.Mesh(new THREE.CapsuleGeometry(0.32, 0.28, 4, 20), skinMat);
        hips.position.y = 0.6;
        body.add(hips);

        const bikiniTopLeft = new THREE.Mesh(new THREE.SphereGeometry(0.12, 32, 32), bikiniMat);
        bikiniTopLeft.position.set(-0.14, 1.23, 0.25);
        body.add(bikiniTopLeft);

        const bikiniTopRight = new THREE.Mesh(new THREE.SphereGeometry(0.12, 32, 32), bikiniMat);
        bikiniTopRight.position.set(0.14, 1.23, 0.25);
        body.add(bikiniTopRight);

        const bikiniBand = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.02, 12, 64), bikiniMat);
        bikiniBand.rotation.x = Math.PI / 2;
        bikiniBand.position.y = 1.1;
        body.add(bikiniBand);

        const bikiniBottom = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.03, 12, 64), bikiniMat);
        bikiniBottom.rotation.x = Math.PI / 2;
        bikiniBottom.position.y = 0.62;
        body.add(bikiniBottom);

        const leftArm = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.4, 4, 12), skinMat);
        leftArm.position.set(-0.55, 1.25, 0);
        leftArm.rotation.z = 0.25;
        body.add(leftArm);

        const rightArm = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.4, 4, 12), skinMat);
        rightArm.position.set(0.55, 1.25, 0);
        rightArm.rotation.z = -0.25;
        body.add(rightArm);

        const leftLeg = new THREE.Mesh(new THREE.CapsuleGeometry(0.1, 0.7, 6, 16), skinMat);
        leftLeg.position.set(-0.16, 0.1, 0);
        body.add(leftLeg);

        const rightLeg = new THREE.Mesh(new THREE.CapsuleGeometry(0.1, 0.7, 6, 16), skinMat);
        rightLeg.position.set(0.16, 0.1, 0);
        body.add(rightLeg);

        const ponyLeft = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.5, 4, 12), hairMat);
        ponyLeft.position.set(-0.35, 1.5, -0.1);
        ponyLeft.rotation.z = 0.9;
        body.add(ponyLeft);

        const ponyRight = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.5, 4, 12), hairMat);
        ponyRight.position.set(0.35, 1.5, -0.1);
        ponyRight.rotation.z = -0.9;
        body.add(ponyRight);

        const floating = document.getElementById('floating');
        const sparkChars = ['*', '+', '.', 'o'];
        window.addEventListener('click', (event) => {
            const spark = document.createElement('div');
            spark.className = 'spark';
            spark.textContent = sparkChars[Math.floor(Math.random() * sparkChars.length)];
            spark.style.left = `${event.clientX}px`;
            spark.style.top = `${event.clientY}px`;
            floating.appendChild(spark);
            setTimeout(() => spark.remove(), 1400);
        });

        let mode = 'idle';
        const danceBtn = document.getElementById('danceBtn');
        const idleBtn = document.getElementById('idleBtn');
        const spinBtn = document.getElementById('spinBtn');

        function setMode(newMode) {
            mode = newMode;
            danceBtn.classList.toggle('active', mode === 'dance');
            idleBtn.classList.toggle('active', mode === 'idle');
            spinBtn.classList.toggle('active', mode === 'spin');
        }

        danceBtn.addEventListener('click', () => setMode('dance'));
        idleBtn.addEventListener('click', () => setMode('idle'));
        spinBtn.addEventListener('click', () => setMode('spin'));

        setMode('idle');

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            if (mode === 'dance') {
                body.position.y = 0.05 + Math.sin(t * 4) * 0.03;
                body.rotation.y = Math.sin(t * 2) * 0.2;
                leftArm.rotation.z = 0.4 + Math.sin(t * 6) * 0.4;
                rightArm.rotation.z = -0.4 + Math.sin(t * 6 + 1) * 0.4;
                ponyLeft.rotation.z = 0.8 + Math.sin(t * 6) * 0.2;
                ponyRight.rotation.z = -0.8 + Math.sin(t * 6 + 1) * 0.2;
            } else if (mode === 'spin') {
                body.rotation.y += 0.01;
                body.position.y = 0.02 + Math.sin(t * 2) * 0.01;
            } else {
                body.position.y = 0.02 + Math.sin(t * 2) * 0.01;
                body.rotation.y = Math.sin(t) * 0.05;
                leftArm.rotation.z = 0.25 + Math.sin(t * 2) * 0.05;
                rightArm.rotation.z = -0.25 + Math.sin(t * 2) * 0.05;
                ponyLeft.rotation.z = 0.9 + Math.sin(t * 2) * 0.05;
                ponyRight.rotation.z = -0.9 + Math.sin(t * 2 + 0.5) * 0.05;
            }

            head.rotation.y = Math.sin(t * 0.8) * 0.08;
            head.rotation.x = Math.sin(t * 0.6) * 0.04;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
