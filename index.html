<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poppy - Interactive VTuber</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(180deg, #0a0a1a 0%, #0f1525 30%, #0a1520 70%, #050510 100%);
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 20px;
        }

        /* Digital grid background */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* Digital particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: #00d4d4;
            border-radius: 50%;
            animation: digitalFloat 6s infinite ease-in-out;
            box-shadow: 0 0 10px #00d4d4;
        }

        @keyframes digitalFloat {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
            50% { transform: translateY(-50px) scale(1.5); opacity: 0.8; }
        }

        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stage {
            position: relative;
            width: 500px;
            height: 680px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        /* Holographic glow */
        .stage::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            height: 200px;
            background: radial-gradient(ellipse at center, rgba(0,212,212,0.2) 0%, transparent 70%);
            filter: blur(40px);
        }

        /* VTuber Character - Miku Style */
        .vtuber {
            position: relative;
            width: 400px;
            height: 650px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .vtuber:hover {
            filter: drop-shadow(0 0 20px rgba(0,212,212,0.3));
        }

        .vtuber.dancing {
            animation: mikuDance 0.6s infinite ease-in-out;
        }

        @keyframes mikuDance {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-12px) rotate(-2deg); }
            50% { transform: translateY(-3px) rotate(0deg); }
            75% { transform: translateY(-12px) rotate(2deg); }
        }

        /* Twin Tails */
        .twintail {
            position: absolute;
            top: 60px;
            width: 45px;
            height: 400px;
            background: linear-gradient(180deg, #00d4d4 0%, #00a8a8 30%, #008888 60%, #006666 100%);
            border-radius: 25px 25px 20px 20px;
            z-index: 2;
            animation: tailSway 2s infinite ease-in-out;
        }

        .twintail.left {
            left: 30px;
            transform: rotate(-15deg);
            transform-origin: top center;
            animation-delay: 0s;
        }

        .twintail.right {
            right: 30px;
            transform: rotate(15deg);
            transform-origin: top center;
            animation-delay: 0.5s;
        }

        .twintail::before {
            content: '';
            position: absolute;
            top: 0;
            left: 5px;
            width: 15px;
            height: 100%;
            background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, transparent 50%);
            border-radius: 10px;
        }

        @keyframes tailSway {
            0%, 100% { transform: rotate(-15deg); }
            50% { transform: rotate(-18deg); }
        }

        .twintail.right {
            animation-name: tailSwayRight;
        }

        @keyframes tailSwayRight {
            0%, 100% { transform: rotate(15deg); }
            50% { transform: rotate(18deg); }
        }

        .vtuber.dancing .twintail.left {
            animation: tailDanceLeft 0.6s infinite ease-in-out;
        }

        .vtuber.dancing .twintail.right {
            animation: tailDanceRight 0.6s infinite ease-in-out;
        }

        @keyframes tailDanceLeft {
            0%, 100% { transform: rotate(-15deg); }
            50% { transform: rotate(-25deg); }
        }

        @keyframes tailDanceRight {
            0%, 100% { transform: rotate(15deg); }
            50% { transform: rotate(25deg); }
        }

        /* Hair ties */
        .hair-tie {
            position: absolute;
            top: 50px;
            width: 25px;
            height: 25px;
            background: radial-gradient(circle, #ff6b9d 0%, #c44569 100%);
            border-radius: 50%;
            z-index: 8;
            box-shadow: 0 0 15px rgba(255,107,157,0.6);
        }

        .hair-tie.left { left: 75px; }
        .hair-tie.right { right: 75px; }

        .hair-tie::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
        }

        /* Back hair */
        .hair-back {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 120px;
            background: linear-gradient(180deg, #00d4d4 0%, #00a8a8 100%);
            border-radius: 80px 80px 40px 40px;
            z-index: 1;
        }

        /* Head */
        .head {
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 130px;
            background: linear-gradient(180deg, #ffeedd 0%, #ffe4d0 50%, #ffd9c0 100%);
            border-radius: 55px 55px 45px 45px;
            z-index: 10;
        }

        /* Bangs */
        .bangs {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 65px;
            background: linear-gradient(180deg, #00d4d4 0%, #00b8b8 100%);
            border-radius: 65px 65px 30px 30px;
            z-index: 20;
        }

        .bangs::before {
            content: '';
            position: absolute;
            bottom: -25px;
            left: 15px;
            width: 30px;
            height: 45px;
            background: linear-gradient(180deg, #00d4d4 0%, #00a8a8 100%);
            border-radius: 0 0 15px 20px;
            transform: rotate(-8deg);
        }

        .bangs::after {
            content: '';
            position: absolute;
            bottom: -20px;
            right: 20px;
            width: 25px;
            height: 35px;
            background: linear-gradient(180deg, #00d4d4 0%, #00a8a8 100%);
            border-radius: 0 0 18px 10px;
            transform: rotate(8deg);
        }

        /* Side hair */
        .side-hair {
            position: absolute;
            top: 70px;
            width: 30px;
            height: 100px;
            background: linear-gradient(180deg, #00d4d4 0%, #008888 100%);
            z-index: 15;
            border-radius: 15px;
        }

        .side-hair.left {
            left: 105px;
            transform: rotate(-5deg);
        }

        .side-hair.right {
            right: 105px;
            transform: rotate(5deg);
        }

        /* Headset */
        .headset {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 80px;
            z-index: 25;
        }

        .headset-band {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 15px;
            background: linear-gradient(90deg, #333 0%, #555 50%, #333 100%);
            border-radius: 10px 10px 0 0;
        }

        .headset-ear {
            position: absolute;
            top: 10px;
            width: 20px;
            height: 40px;
            background: linear-gradient(180deg, #444 0%, #222 100%);
            border-radius: 5px;
        }

        .headset-ear.left { left: 5px; }
        .headset-ear.right { right: 5px; }

        .headset-ear::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: #00d4d4;
            border-radius: 50%;
            box-shadow: 0 0 10px #00d4d4;
        }

        /* Microphone */
        .microphone {
            position: absolute;
            top: 55px;
            left: 0;
            width: 40px;
            height: 3px;
            background: #333;
            transform: rotate(30deg);
            transform-origin: left center;
        }

        .microphone::after {
            content: '';
            position: absolute;
            right: -8px;
            top: -5px;
            width: 12px;
            height: 12px;
            background: #222;
            border-radius: 50%;
            border: 2px solid #00d4d4;
            box-shadow: 0 0 8px #00d4d4;
        }

        /* Eyes - Anime style with teal */
        .eyes {
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            display: flex;
            justify-content: space-between;
            z-index: 22;
        }

        .eye {
            width: 30px;
            height: 32px;
            background: white;
            border-radius: 50% 50% 45% 45%;
            position: relative;
            overflow: hidden;
        }

        .eye-lid {
            position: absolute;
            top: -32px;
            left: -2px;
            right: -2px;
            height: 34px;
            background: linear-gradient(180deg, #ffeedd 0%, #ffe4d0 100%);
            transition: top 0.1s ease;
            z-index: 5;
        }

        .vtuber.blink .eye-lid {
            top: 0px;
        }

        .iris {
            position: absolute;
            width: 22px;
            height: 26px;
            background: radial-gradient(circle at 30% 30%, #00ffff 0%, #00d4d4 30%, #00a8a8 60%, #006666 100%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -40%);
            transition: all 0.1s ease;
        }

        .pupil {
            position: absolute;
            width: 10px;
            height: 12px;
            background: #0a1520;
            border-radius: 50%;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .eye-highlight {
            position: absolute;
            width: 6px;
            height: 8px;
            background: rgba(255,255,255,0.95);
            border-radius: 50%;
            top: 4px;
            right: 2px;
        }

        .eye-highlight-2 {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            bottom: 6px;
            left: 3px;
        }

        /* Digital glow in eyes */
        .eye-glow {
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 4px;
            background: linear-gradient(90deg, transparent, rgba(0,255,255,0.5), transparent);
            border-radius: 2px;
        }

        /* Nose */
        .nose {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 8px;
            z-index: 21;
        }

        .nose::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 3px;
            background: rgba(200,150,130,0.3);
            border-radius: 50%;
        }

        /* Mouth */
        .mouth {
            position: absolute;
            top: 115px;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 8px;
            z-index: 21;
        }

        .mouth-line {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 6px;
            border-bottom: 2px solid #d49080;
            border-radius: 0 0 50% 50%;
            transition: all 0.2s ease;
        }

        .vtuber.smile .mouth-line {
            width: 18px;
            height: 10px;
            border-bottom-width: 3px;
        }

        .vtuber.talking .mouth-line {
            animation: mikuTalk 0.15s infinite;
        }

        @keyframes mikuTalk {
            0%, 100% { height: 6px; }
            50% { height: 15px; border-radius: 50%; background: #3a1a1a; border: none; }
        }

        /* Blush */
        .cheeks {
            position: absolute;
            top: 95px;
            left: 50%;
            transform: translateX(-50%);
            width: 95px;
            display: flex;
            justify-content: space-between;
            z-index: 16;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .cheek {
            width: 18px;
            height: 8px;
            background: radial-gradient(ellipse, rgba(255,100,150,0.5) 0%, transparent 70%);
            border-radius: 50%;
        }

        .vtuber.blushing .cheeks,
        .vtuber:hover .cheeks {
            opacity: 1;
        }

        /* Neck */
        .neck {
            position: absolute;
            top: 155px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 35px;
            background: linear-gradient(180deg, #ffd9c0 0%, #ffd0b0 100%);
            z-index: 5;
        }

        /* Body - Miku outfit */
        .body {
            position: absolute;
            top: 180px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 280px;
            z-index: 4;
        }

        .top {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 120px;
            background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
            border-radius: 70px 70px 20px 20px;
            z-index: 3;
        }

        /* Tie */
        .tie {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
        }

        .tie-knot {
            width: 15px;
            height: 15px;
            background: #00d4d4;
            transform: rotate(45deg);
            margin: 0 auto;
            box-shadow: 0 0 10px rgba(0,212,212,0.5);
        }

        .tie-body {
            width: 20px;
            height: 60px;
            background: linear-gradient(180deg, #00d4d4 0%, #008888 100%);
            margin: -5px auto 0;
            clip-path: polygon(20% 0, 80% 0, 100% 100%, 0% 100%);
            box-shadow: 0 0 15px rgba(0,212,212,0.3);
        }

        /* Collar details */
        .collar {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 25px;
            z-index: 5;
        }

        .collar::before,
        .collar::after {
            content: '';
            position: absolute;
            top: 0;
            width: 35px;
            height: 25px;
            background: #ddd;
            clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
        }

        .collar::before { left: 0; transform: rotate(-5deg); }
        .collar::after { right: 0; transform: rotate(5deg); }

        /* Skirt */
        .skirt {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 120px;
            background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 50%, #0f0f0f 100%);
            border-radius: 10px 10px 75px 75px;
            z-index: 2;
        }

        /* Skirt teal trim */
        .skirt::before {
            content: '';
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            height: 8px;
            background: #00d4d4;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0,212,212,0.5);
        }

        /* Digital pattern on skirt */
        .skirt-pattern {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 60px;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 8px,
                rgba(0,212,212,0.1) 8px,
                rgba(0,212,212,0.1) 10px
            );
        }

        /* Arms with sleeves */
        .arm {
            position: absolute;
            top: 195px;
            width: 30px;
            z-index: 6;
            transform-origin: top center;
        }

        .arm.left {
            left: 100px;
            transform: rotate(-20deg);
        }

        .arm.right {
            right: 100px;
            transform: rotate(20deg);
        }

        .sleeve {
            width: 30px;
            height: 50px;
            background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
            border-radius: 15px 15px 10px 10px;
        }

        .arm-skin {
            position: absolute;
            top: 45px;
            left: 50%;
            transform: translateX(-50%);
            width: 25px;
            height: 80px;
            background: linear-gradient(180deg, #ffeedd 0%, #ffd9c0 100%);
            border-radius: 12px;
        }

        /* Arm warmers */
        .arm-warmer {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 55px;
            background: linear-gradient(180deg, #333 0%, #222 100%);
            border-radius: 5px 5px 12px 12px;
            border-top: 3px solid #00d4d4;
            box-shadow: 0 0 8px rgba(0,212,212,0.3);
        }

        .hand {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 22px;
            background: linear-gradient(180deg, #ffeedd 0%, #ffd0b0 100%);
            border-radius: 50% 50% 45% 45%;
        }

        .vtuber.dancing .arm.left {
            animation: mikuArmLeft 0.6s infinite ease-in-out;
        }

        .vtuber.dancing .arm.right {
            animation: mikuArmRight 0.6s infinite ease-in-out;
        }

        @keyframes mikuArmLeft {
            0%, 100% { transform: rotate(-20deg); }
            50% { transform: rotate(-50deg) translateY(-10px); }
        }

        @keyframes mikuArmRight {
            0%, 100% { transform: rotate(20deg); }
            50% { transform: rotate(50deg) translateY(-10px); }
        }

        /* Legs */
        .legs {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 180px;
            display: flex;
            justify-content: space-between;
            z-index: 1;
        }

        .leg {
            width: 30px;
            height: 180px;
            position: relative;
        }

        .thigh {
            width: 30px;
            height: 60px;
            background: linear-gradient(180deg, #ffeedd 0%, #ffd9c0 100%);
            border-radius: 15px 15px 12px 12px;
        }

        .boot {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 125px;
            background: linear-gradient(180deg, #333 0%, #1a1a1a 100%);
            border-radius: 5px 5px 8px 8px;
        }

        .boot::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 26px;
            height: 4px;
            background: #00d4d4;
            border-radius: 2px;
            box-shadow: 0 0 8px #00d4d4;
        }

        .boot::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 15px;
            background: linear-gradient(180deg, #222 0%, #111 100%);
            border-radius: 5px;
        }

        /* Number 01 badge */
        .badge-01 {
            position: absolute;
            top: 210px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #00d4d4;
            text-shadow: 0 0 10px #00d4d4;
            z-index: 10;
        }

        /* Hearts */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .floating-heart {
            position: absolute;
            font-size: 20px;
            animation: floatUp 2s ease-out forwards;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.5); }
            100% { opacity: 0; transform: translateY(-120px) scale(1.3) rotate(10deg); }
        }

        /* Digital notes for singing */
        .note {
            position: absolute;
            font-size: 18px;
            color: #00d4d4;
            text-shadow: 0 0 10px #00d4d4;
            animation: noteFloat 1.5s ease-out forwards;
            opacity: 0;
        }

        @keyframes noteFloat {
            0% { opacity: 1; transform: translateY(0) translateX(0) scale(0.5); }
            100% { opacity: 0; transform: translateY(-100px) translateX(30px) scale(1.2); }
        }

        /* Speech bubble */
        .speech-bubble {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10,20,30,0.9);
            border: 2px solid #00d4d4;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 14px;
            color: #00d4d4;
            opacity: 0;
            transition: all 0.3s ease;
            white-space: nowrap;
            z-index: 200;
            box-shadow: 0 0 20px rgba(0,212,212,0.3);
            font-family: 'Orbitron', sans-serif;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 12px solid #00d4d4;
        }

        .speech-bubble.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-10px);
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .btn {
            padding: 14px 40px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Orbitron', sans-serif;
            border: 2px solid #00d4d4;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: transparent;
            color: #00d4d4;
        }

        .btn:hover {
            background: #00d4d4;
            color: #0a1520;
            box-shadow: 0 0 30px rgba(0,212,212,0.5);
        }

        .btn.active {
            background: #00d4d4;
            color: #0a1520;
            box-shadow: 0 0 30px rgba(0,212,212,0.5);
        }

        /* Name */
        .name-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: #00d4d4;
            text-shadow: 0 0 30px rgba(0,212,212,0.8);
            margin-top: 15px;
            letter-spacing: 5px;
        }

        .subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            color: rgba(0,212,212,0.6);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Holographic scan line effect */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0,212,212,0.5), transparent);
            animation: scan 3s infinite linear;
            pointer-events: none;
            z-index: 50;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="particles" id="particles"></div>
    <div class="hearts-container" id="hearts"></div>

    <div class="container">
        <div class="stage">
            <div class="speech-bubble" id="speech"></div>
            <div class="scanline"></div>
            
            <div class="vtuber" id="vtuber">
                <!-- Twin Tails -->
                <div class="twintail left"></div>
                <div class="twintail right"></div>
                <div class="hair-tie left"></div>
                <div class="hair-tie right"></div>
                
                <!-- Back hair -->
                <div class="hair-back"></div>
                
                <!-- Side hair -->
                <div class="side-hair left"></div>
                <div class="side-hair right"></div>
                
                <!-- Headset -->
                <div class="headset">
                    <div class="headset-band"></div>
                    <div class="headset-ear left"></div>
                    <div class="headset-ear right"></div>
                    <div class="microphone"></div>
                </div>
                
                <!-- Head -->
                <div class="head">
                    <!-- Bangs -->
                    <div class="bangs"></div>
                    
                    <!-- Eyes -->
                    <div class="eyes">
                        <div class="eye left">
                            <div class="eye-lid"></div>
                            <div class="iris" id="iris-left">
                                <div class="pupil"></div>
                                <div class="eye-highlight"></div>
                                <div class="eye-highlight-2"></div>
                                <div class="eye-glow"></div>
                            </div>
                        </div>
                        <div class="eye right">
                            <div class="eye-lid"></div>
                            <div class="iris" id="iris-right">
                                <div class="pupil"></div>
                                <div class="eye-highlight"></div>
                                <div class="eye-highlight-2"></div>
                                <div class="eye-glow"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Nose -->
                    <div class="nose"></div>
                    
                    <!-- Mouth -->
                    <div class="mouth">
                        <div class="mouth-line"></div>
                    </div>
                    
                    <!-- Cheeks -->
                    <div class="cheeks">
                        <div class="cheek"></div>
                        <div class="cheek"></div>
                    </div>
                </div>
                
                <!-- Neck -->
                <div class="neck"></div>
                
                <!-- Body -->
                <div class="body">
                    <div class="top">
                        <div class="collar"></div>
                        <div class="tie">
                            <div class="tie-knot"></div>
                            <div class="tie-body"></div>
                        </div>
                    </div>
                    <div class="skirt">
                        <div class="skirt-pattern"></div>
                    </div>
                    <div class="badge-01">01</div>
                </div>
                
                <!-- Arms -->
                <div class="arm left">
                    <div class="sleeve"></div>
                    <div class="arm-skin">
                        <div class="arm-warmer"></div>
                        <div class="hand"></div>
                    </div>
                </div>
                <div class="arm right">
                    <div class="sleeve"></div>
                    <div class="arm-skin">
                        <div class="arm-warmer"></div>
                        <div class="hand"></div>
                    </div>
                </div>
                
                <!-- Legs -->
                <div class="legs">
                    <div class="leg left">
                        <div class="thigh"></div>
                        <div class="boot"></div>
                    </div>
                    <div class="leg right">
                        <div class="thigh"></div>
                        <div class="boot"></div>
                    </div>
                </div>
            </div>
        </div>

        <h1 class="name-tag">POPPY</h1>
        <p class="subtitle">Virtual Singer</p>

        <div class="controls">
            <button class="btn" id="danceBtn">♪ Dance ♪</button>
            <button class="btn" id="singBtn">Sing</button>
        </div>
    </div>

    <script>
        // Create particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            const size = Math.random() * 4 + 2;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.animationDelay = Math.random() * 6 + 's';
            particle.style.animationDuration = (Math.random() * 3 + 4) + 's';
            particlesContainer.appendChild(particle);
        }

        const vtuber = document.getElementById('vtuber');
        const speech = document.getElementById('speech');
        const heartsContainer = document.getElementById('hearts');
        const danceBtn = document.getElementById('danceBtn');
        const singBtn = document.getElementById('singBtn');
        const irisLeft = document.getElementById('iris-left');
        const irisRight = document.getElementById('iris-right');

        let isDancing = false;
        let isSinging = false;

        const phrases = [
            "Miku miku ni shite ageru~",
            "Let's sing together!",
            "♪ La la la~ ♪",
            "World is Mine!",
            "You're my number one fan!",
            "Digital love~",
            "39! Thank you!",
            "Levan Polkka~",
            "I'll keep singing for you",
            "Sekai de ichiban!"
        ];

        // Smooth eye tracking
        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;

        document.addEventListener('mousemove', (e) => {
            const rect = vtuber.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + 100;

            targetX = (e.clientX - centerX) / 100;
            targetY = (e.clientY - centerY) / 100;

            targetX = Math.max(-3, Math.min(3, targetX));
            targetY = Math.max(-2, Math.min(2, targetY));
        });

        function animateEyes() {
            currentX += (targetX - currentX) * 0.08;
            currentY += (targetY - currentY) * 0.08;

            irisLeft.style.transform = `translate(calc(-50% + ${currentX}px), calc(-40% + ${currentY}px))`;
            irisRight.style.transform = `translate(calc(-50% + ${currentX}px), calc(-40% + ${currentY}px))`;

            requestAnimationFrame(animateEyes);
        }
        animateEyes();

        // Click interaction
        vtuber.addEventListener('click', (e) => {
            speech.textContent = phrases[Math.floor(Math.random() * phrases.length)];
            speech.classList.add('show');
            setTimeout(() => speech.classList.remove('show'), 2500);

            vtuber.classList.add('smile', 'blushing');
            setTimeout(() => vtuber.classList.remove('smile', 'blushing'), 1500);

            vtuber.classList.add('blink');
            setTimeout(() => vtuber.classList.remove('blink'), 120);

            // Create hearts and notes
            for (let i = 0; i < 4; i++) {
                setTimeout(() => {
                    if (Math.random() > 0.5) {
                        createHeart(e.clientX + (Math.random() - 0.5) * 60, e.clientY);
                    } else {
                        createNote(e.clientX + (Math.random() - 0.5) * 60, e.clientY);
                    }
                }, i * 80);
            }
        });

        function createHeart(x, y) {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = '♡';
            heart.style.left = x + 'px';
            heart.style.top = y + 'px';
            heart.style.color = `hsl(${180 + Math.random() * 20}, 100%, 70%)`;
            heartsContainer.appendChild(heart);
            setTimeout(() => heart.remove(), 2000);
        }

        function createNote(x, y) {
            const note = document.createElement('div');
            note.className = 'note';
            note.innerHTML = ['♪', '♫', '♬'][Math.floor(Math.random() * 3)];
            note.style.left = x + 'px';
            note.style.top = y + 'px';
            heartsContainer.appendChild(note);
            setTimeout(() => note.remove(), 1500);
        }

        // Dance toggle
        danceBtn.addEventListener('click', () => {
            isDancing = !isDancing;
            if (isDancing) {
                vtuber.classList.add('dancing');
                danceBtn.classList.add('active');
                danceBtn.textContent = '■ Stop';
                speech.textContent = "♪ Let's dance! ♪";
                speech.classList.add('show');
                vtuber.classList.add('smile');
                setTimeout(() => speech.classList.remove('show'), 2000);
            } else {
                vtuber.classList.remove('dancing', 'smile');
                danceBtn.classList.remove('active');
                danceBtn.textContent = '♪ Dance ♪';
            }
        });

        // Sing toggle
        singBtn.addEventListener('click', () => {
            isSinging = !isSinging;
            if (isSinging) {
                vtuber.classList.add('talking');
                singBtn.classList.add('active');
                singBtn.textContent = '■ Stop';
                speech.textContent = "♪ Miku miku ni shite ageru~ ♪";
                speech.classList.add('show');
                
                // Create continuous notes
                const noteInterval = setInterval(() => {
                    if (!isSinging) {
                        clearInterval(noteInterval);
                        return;
                    }
                    const rect = vtuber.getBoundingClientRect();
                    createNote(rect.left + rect.width / 2 + (Math.random() - 0.5) * 100, rect.top + 50);
                }, 300);
            } else {
                vtuber.classList.remove('talking');
                singBtn.classList.remove('active');
                singBtn.textContent = 'Sing';
                speech.classList.remove('show');
            }
        });

        // Natural blinking
        function randomBlink() {
            vtuber.classList.add('blink');
            setTimeout(() => vtuber.classList.remove('blink'), 120);
            setTimeout(randomBlink, 2500 + Math.random() * 2500);
        }
        setTimeout(randomBlink, 2000);

        // Occasional expressions
        setInterval(() => {
            if (!isDancing && !isSinging && Math.random() > 0.85) {
                vtuber.classList.add('smile');
                setTimeout(() => vtuber.classList.remove('smile'), 2000);
            }
        }, 4000);
    </script>
</body>
</html>
